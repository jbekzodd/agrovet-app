<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroVet AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 15px; }
        .box { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { color: #2e7d32; margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .label { font-size: 14px; margin: 10px 0 5px; color: #555; display: block; }
        select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; background: #fafafa; }
        .btn { background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .btn-feedback { background: #0088cc; color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 10px; font-weight: bold; }
        .result { display: none; background: #e8f5e9; border-radius: 10px; padding: 15px; margin-top: 15px; font-size: 14px; line-height: 1.6; color: #1b5e20; white-space: pre-line; border-left: 4px solid #2e7d32; }
    </style>
</head>
<body>

    <!-- 1. AI Diagnostika -->
    <div class="box">
        <h2>🩺 AI Diagnostika</h2>
        <span class="label">Hayvon turini tanlang:</span>
        <select id="animal">
            <option>🐄 Qoramol</option>
            <option>🐑 Qo'y / Echki</option>
            <option>🐔 Parranda</option>
        </select>
        <span class="label">Kasallik belgilarini yozing:</span>
        <textarea id="symptoms" placeholder="Masalan: Yemamayapti, isitmasi bor..."></textarea>
        <button class="btn" onclick="askAI()">🤖 Tahlil qilish</button>
        <div id="result" class="result"></div>
    </div>

    <!-- 2. Online Bozor -->
    <div class="box">
        <h2>🛒 Online Agro-Bozor</h2>
        <p style="font-size: 13px; color: #666;">Chorva mollari, sifatli yemlar va dori-darmonlar savdosi.</p>
        <button class="btn" style="background:#ff9800;" onclick="alert('Bo\'lim ustida ishlayapmiz!')">Bozorga o'tish</button>
    </div>

    <!-- 3. Feedback -->
    <div class="box">
        <h2>📩 Aloqa va Takliflar</h2>
        <p style="font-size: 13px; color: #666;">Dastur bo'yicha savollaringiz bo'lsa, dasturchi bilan bog'laning:</p>
        <a href="https://t.me/jovliyev_bekzod" class="btn-feedback">Dasturchiga yozish (@jovliyev_bekzod)</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const API_KEY = "AQ.Ab8RN6K5ZbXR5PrL38mcvoqM84h93bZVoSs0hYHBa2U2UjWUqA";

        async function askAI() {
            const animal = document.getElementById('animal').value;
            const symptoms = document.getElementById('symptoms').value.trim();
            const resDiv = document.getElementById('result');
            
            if(!symptoms) return alert("Iltimos, belgini yozing!");
            
            resDiv.innerText = "⏳ Tahlil qilinmoqda...";
            resDiv.style.display = 'block';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: `Siz veterinarsiz. Hayvon: ${animal}. Belgilar: ${symptoms}. Qisqa maslahat bering.`}]}]})
                });
                const data = await response.json();
                resDiv.innerText = data.candidates[0].content.parts[0].text;
            } catch(e) { resDiv.innerText = "Xatolik yuz berdi."; }
        }
    </script>
</body>
</html>
